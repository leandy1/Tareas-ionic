
<div class="ns-header" *ngIf="vm$ | async as vm">
  <div class="ns-status-pill" [ngClass]="vm.connected ? 'online' : 'offline'">
    <span class="pill-label">{{ vm.connectionType | uppercase }}</span>
    <span class="pill-dot"></span>
  </div>
</div>


<ion-card class="ns-card" *ngIf="vm$ | async as vm">
  <ion-card-header>
    <ion-card-title>
      <ion-icon name="stats-chart-outline"></ion-icon>
      Estado de conectividad
    </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <div class="ns-row">
      <span class="ns-label">Estado actual</span>
      <span class="ns-value" [ngClass]="vm.connected ? 'text-online' : 'text-offline'">
        {{ vm.connected ? 'En línea' : 'Sin conexión' }}
      </span>
    </div>

    <div class="ns-row">
      <span class="ns-label">Tipo de red</span>
      <span class="ns-value text-accent">{{ vm.connectionType }}</span>
    </div>

    <div class="ns-row">
      <span class="ns-label">Última actualización</span>
      <span class="ns-value">{{ vm.lastUpdated }}</span>
    </div>

    <div class="ns-offline-msg" *ngIf="!vm.connected">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Estás sin conexión. Tus cambios se guardarán localmente y se sincronizarán al reconectarte.</span>
    </div>
  </ion-card-content>
</ion-card>
